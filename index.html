<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI3DSTUDIO</title>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif
}

body{
    display:flex;
    flex-direction:column
}

.topbar{
    height:58px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#080808;
    border-bottom:1px solid #222
}

.brand{
    display:flex;
    align-items:center;
    gap:12px
}

.brand-mark{
    width:28px;
    height:28px;
    border:2px solid #ff8a24;
    transform:rotate(45deg);
    display:flex;
    align-items:center;
    justify-content:center
}

.brand-mark span{
    width:8px;
    height:8px;
    background:#ff8a24
}

.brand-name{
    font-size:17px;
    font-weight:700;
    letter-spacing:2px
}

.top-center{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    color:#666;
    font-size:10px;
    letter-spacing:3px
}

.system-status{
    display:flex;
    align-items:center;
    gap:8px;
    color:#888;
    font-size:10px;
    letter-spacing:1px
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ff8a24;
    box-shadow:0 0 10px #ff8a24
}

.workspace{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:76px minmax(0,1fr) 270px
}

.toolbar{
    background:#090909;
    border-right:1px solid #222;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 8px;
    gap:7px
}

.tool{
    width:58px;
    height:48px;
    border:1px solid transparent;
    border-radius:6px;
    background:transparent;
    color:#777;
    cursor:pointer;
    font-size:8px;
    letter-spacing:1px;
    transition:.15s
}

.tool:hover{
    background:#151515;
    color:#fff
}

.tool.active{
    border-color:#ff8a24;
    color:#ff8a24;
    background:#151515
}

.tool-icon{
    display:block;
    font-size:16px;
    margin-bottom:4px
}

.tool-separator{
    width:38px;
    height:1px;
    background:#222;
    margin:3px
}

.viewport-area{
    position:relative;
    min-width:0;
    min-height:0;
    overflow:hidden;
    background:#050505
}

#viewport{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    outline:none
}

.viewport-title{
    position:absolute;
    top:14px;
    left:17px;
    color:#555;
    font-size:9px;
    letter-spacing:2px;
    pointer-events:none
}

.viewport-mode{
    position:absolute;
    top:12px;
    right:17px;
    padding:6px 9px;
    border:1px solid #242424;
    background:rgba(5,5,5,.8);
    color:#777;
    font-size:8px;
    letter-spacing:1px;
    pointer-events:none
}

.axis-indicator{
    position:absolute;
    left:16px;
    bottom:16px;
    width:70px;
    height:70px;
    border:1px solid #222;
    background:rgba(5,5,5,.7);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#555;
    font-size:9px;
    pointer-events:none
}

.selection-info{
    position:absolute;
    left:100px;
    bottom:16px;
    padding:8px 11px;
    border:1px solid #222;
    background:rgba(5,5,5,.85);
    color:#777;
    font-size:9px;
    pointer-events:none
}

.right-panel{
    background:#090909;
    border-left:1px solid #222;
    display:flex;
    flex-direction:column;
    min-height:0
}

.panel-section{
    border-bottom:1px solid #222;
    padding:14px
}

.panel-title{
    color:#777;
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:12px
}

.hierarchy{
    max-height:180px;
    overflow-y:auto
}

.object-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    color:#888;
    font-size:10px;
    border-radius:4px;
    cursor:pointer
}

.object-row:hover{
    background:#151515;
    color:#fff
}

.object-row.selected{
    background:#1b120b;
    color:#ff8a24
}

.object-icon{
    color:#555
}

.object-row.selected .object-icon{
    color:#ff8a24
}

.property{
    display:grid;
    grid-template-columns:67px 1fr;
    gap:7px;
    align-items:center;
    margin-bottom:7px
}

.property label{
    color:#666;
    font-size:9px
}

.property input{
    width:100%;
    height:26px;
    border:1px solid #242424;
    border-radius:3px;
    background:#0d0d0d;
    color:#ccc;
    padding:0 6px;
    font-size:9px;
    outline:none
}

.property input:focus{
    border-color:#ff8a24
}

.property-values{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px
}

.property-values input{
    text-align:center
}

.webcam-box{
    height:105px;
    border:1px solid #222;
    background:#080808;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#444;
    font-size:8px;
    letter-spacing:2px
}

.ai-panel{
    margin-top:auto;
    border-top:1px solid #222;
    padding:12px
}

.ai-input{
    display:flex;
    gap:5px
}

.ai-input input{
    flex:1;
    min-width:0;
    height:33px;
    border:1px solid #292929;
    border-radius:4px;
    background:#0d0d0d;
    color:#fff;
    padding:0 8px;
    outline:none;
    font-size:9px
}

.ai-input input:focus{
    border-color:#ff8a24
}

.ai-send{
    width:38px;
    border:1px solid #ff8a24;
    border-radius:4px;
    background:#ff8a24;
    color:#050505;
    cursor:pointer;
    font-weight:bold
}

.bottom-bar{
    height:34px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:#080808;
    border-top:1px solid #222;
    color:#555;
    font-size:8px;
    letter-spacing:1px
}

.bottom-left,
.bottom-right{
    display:flex;
    gap:18px
}

.orange{
    color:#ff8a24
}

.toast{
    position:fixed;
    left:50%;
    bottom:48px;
    transform:translateX(-50%) translateY(10px);
    padding:9px 16px;
    border:1px solid #ff8a24;
    border-radius:5px;
    background:#0b0b0b;
    color:#fff;
    font-size:10px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:100
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0)
}

@media(max-width:850px){
    .workspace{
        grid-template-columns:65px minmax(0,1fr)
    }

    .right-panel{
        display:none
    }

    .top-center{
        display:none
    }
}
</style>
</head>

<body>

<header class="topbar">

<div class="brand">
    <div class="brand-mark"><span></span></div>
    <div class="brand-name">AI3DSTUDIO</div>
</div>

<div class="top-center">3D DESIGN ENVIRONMENT</div>

<div class="system-status">
    <span class="status-dot"></span>
    SYSTEM ONLINE
</div>

</header>

<div class="workspace">

<aside class="toolbar">

<button class="tool active" data-tool="select">
    <span class="tool-icon">↖</span>
    SELECT
</button>

<button class="tool" data-tool="translate">
    <span class="tool-icon">✥</span>
    MOVE
</button>

<button class="tool" data-tool="rotate">
    <span class="tool-icon">⟳</span>
    ROTATE
</button>

<button class="tool" data-tool="scale">
    <span class="tool-icon">◇</span>
    SCALE
</button>

<div class="tool-separator"></div>

<button class="tool" data-create="cube">
    <span class="tool-icon">■</span>
    CUBE
</button>

<button class="tool" data-create="sphere">
    <span class="tool-icon">●</span>
    SPHERE
</button>

<button class="tool" data-create="cylinder">
    <span class="tool-icon">▣</span>
    CYLINDER
</button>

<div class="tool-separator"></div>

<button class="tool" id="deleteTool">
    <span class="tool-icon">×</span>
    DELETE
</button>

<button class="tool" id="saveTool">
    <span class="tool-icon">↓</span>
    SAVE
</button>

<button class="tool" id="loadTool">
    <span class="tool-icon">↑</span>
    LOAD
</button>

</aside>

<main class="viewport-area">

<canvas id="viewport"></canvas>

<div class="viewport-title">
    AI3DSTUDIO / VIEWPORT
</div>

<div class="viewport-mode" id="modeLabel">
    SELECT MODE
</div>

<div class="axis-indicator">
    X / Y / Z
</div>

<div class="selection-info" id="selectionInfo">
    NO OBJECT SELECTED
</div>

</main>

<aside class="right-panel">

<section class="panel-section">

<div class="panel-title">SCENE HIERARCHY</div>

<div class="hierarchy" id="hierarchy"></div>

</section>

<section class="panel-section">

<div class="panel-title">PROPERTIES</div>

<div class="property">
<label>NAME</label>
<input id="objectName" type="text">
</div>

<div class="property">
<label>POSITION</label>
<div class="property-values">
<input id="posX" type="number" step=".1">
<input id="posY" type="number" step=".1">
<input id="posZ" type="number" step=".1">
</div>
</div>

<div class="property">
<label>ROTATION</label>
<div class="property-values">
<input id="rotX" type="number" step="1">
<input id="rotY" type="number" step="1">
<input id="rotZ" type="number" step="1">
</div>
</div>

<div class="property">
<label>SCALE</label>
<div class="property-values">
<input id="scaleX" type="number" step=".1">
<input id="scaleY" type="number" step=".1">
<input id="scaleZ" type="number" step=".1">
</div>
</div>

</section>

<section class="panel-section">

<div class="panel-title">WEBCAM</div>

<div class="webcam-box">
WEBCAM STANDBY
</div>

</section>

<section class="ai-panel">

<div class="panel-title">AI COMMAND</div>

<div class="ai-input">
<input id="aiCommand" placeholder="Create Cube..." autocomplete="off">
<button class="ai-send" id="aiSend">→</button>
</div>

</section>

</aside>

</div>

<footer class="bottom-bar">

<div class="bottom-left">
<span>AI ENGINE: <span class="orange">READY</span></span>
<span>MODE: <span class="orange" id="bottomMode">SELECT</span></span>
<span>OBJECTS: <span class="orange" id="objectCount">0</span></span>
</div>

<div class="bottom-right">
<span>LEFT DRAG: ORBIT</span>
<span>RIGHT DRAG: PAN</span>
<span>SCROLL: ZOOM</span>
</div>

</footer>

<div class="toast" id="toast"></div>

<script type="module">

import * as THREE from "three";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

import { TransformControls }
from "three/addons/controls/TransformControls.js";

const canvas =
    document.getElementById("viewport");

const renderer =
    new THREE.WebGLRenderer({
        canvas:canvas,
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setClearColor(0x050505);

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x050505);

const camera =
    new THREE.PerspectiveCamera(
        55,
        1,
        0.1,
        1000
    );

camera.position.set(7,5,8);

const orbit =
    new OrbitControls(
        camera,
        canvas
    );

orbit.enableDamping = true;
orbit.dampingFactor = 0.08;
orbit.target.set(0,0,0);

orbit.mouseButtons.LEFT =
    THREE.MOUSE.ROTATE;

orbit.mouseButtons.MIDDLE =
    THREE.MOUSE.DOLLY;

orbit.mouseButtons.RIGHT =
    THREE.MOUSE.PAN;

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.7
    );

scene.add(ambient);

const light =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

light.position.set(5,10,8);

scene.add(light);

const grid =
    new THREE.GridHelper(
        30,
        30,
        0x333333,
        0x171717
    );

scene.add(grid);

const axes =
    new THREE.AxesHelper(4);

scene.add(axes);

const transform =
    new TransformControls(
        camera,
        canvas
    );

scene.add(
    transform.getHelper()
);

transform.addEventListener(
    "dragging-changed",
    function(event){
        orbit.enabled = !event.value;
    }
);

transform.addEventListener(
    "objectChange",
    function(){
        updateProperties();
    }
);

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

const objects = [];

let selected = null;

let currentTool = "select";

let objectNumber = 0;

function showToast(message){

    const element =
        document.getElementById("toast");

    element.textContent = message;

    element.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
        setTimeout(
            function(){
                element.classList.remove("show");
            },
            1400
        );
}

function createMaterial(){

    return new THREE.MeshStandardMaterial({
        color:0x777777,
        roughness:.55,
        metalness:.2
    });
}

function createObject(type){

    let geometry;

    if(type === "cube"){
        geometry =
            new THREE.BoxGeometry(
                2,2,2
            );
    }

    if(type === "sphere"){
        geometry =
            new THREE.SphereGeometry(
                1.2,
                32,
                20
            );
    }

    if(type === "cylinder"){
        geometry =
            new THREE.CylinderGeometry(
                1.1,
                1.1,
                2.2,
                32
            );
    }

    if(!geometry){
        return;
    }

    const object =
        new THREE.Mesh(
            geometry,
            createMaterial()
        );

    objectNumber++;

    object.name =
        type.charAt(0).toUpperCase() +
        type.slice(1) +
        "." +
        String(objectNumber).padStart(3,"0");

    object.position.set(
        0,
        1,
        0
    );

    scene.add(object);

    objects.push(object);

    selectObject(object);

    updateHierarchy();

    updateObjectCount();

    showToast(
        object.name + " created"
    );
}

function selectObject(object){

    if(selected){
        selected.material.emissive.setHex(
            0x000000
        );
    }

    selected = object;

    if(selected){

        selected.material.emissive.setHex(
            0x331505
        );

        document.getElementById(
            "selectionInfo"
        ).textContent =
            "SELECTED: " +
            selected.name;

        if(currentTool !== "select"){

            transform.setMode(
                currentTool
            );

            transform.attach(
                selected
            );
        }

    }else{

        transform.detach();

        document.getElementById(
            "selectionInfo"
        ).textContent =
            "NO OBJECT SELECTED";
    }

    updateHierarchy();

    updateProperties();
}

function deselect(){

    if(selected){

        selected.material.emissive.setHex(
            0x000000
        );
    }

    selected = null;

    transform.detach();

    document.getElementById(
        "selectionInfo"
    ).textContent =
        "NO OBJECT SELECTED";

    updateHierarchy();

    updateProperties();
}

function updateHierarchy(){

    const hierarchy =
        document.getElementById(
            "hierarchy"
        );

    hierarchy.innerHTML = "";

    objects.forEach(
        function(object){

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "object-row";

            if(object === selected){
                row.classList.add(
                    "selected"
                );
            }

            row.innerHTML =
                '<span class="object-icon">◆</span>' +
                '<span>' +
                object.name +
                '</span>';

            row.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    selectObject(object);
                }
            );

            hierarchy.appendChild(row);
        }
    );
}

function updateObjectCount(){

    document.getElementById(
        "objectCount"
    ).textContent =
        objects.length;
}

function updateProperties(){

    if(!selected){

        document.getElementById(
            "objectName"
        ).value = "";

        return;
    }

    document.getElementById(
        "objectName"
    ).value =
        selected.name;

    document.getElementById(
        "posX"
    ).value =
        selected.position.x.toFixed(2);

    document.getElementById(
        "posY"
    ).value =
        selected.position.y.toFixed(2);

    document.getElementById(
        "posZ"
    ).value =
        selected.position.z.toFixed(2);

    document.getElementById(
        "rotX"
    ).value =
        THREE.MathUtils.radToDeg(
            selected.rotation.x
        ).toFixed(1);

    document.getElementById(
        "rotY"
    ).value =
        THREE.MathUtils.radToDeg(
            selected.rotation.y
        ).toFixed(1);

    document.getElementById(
        "rotZ"
    ).value =
        THREE.MathUtils.radToDeg(
            selected.rotation.z
        ).toFixed(1);

    document.getElementById(
        "scaleX"
    ).value =
        selected.scale.x.toFixed(2);

    document.getElementById(
        "scaleY"
    ).value =
        selected.scale.y.toFixed(2);

    document.getElementById(
        "scaleZ"
    ).value =
        selected.scale.z.toFixed(2);
}

function setTool(tool){

    currentTool = tool;

    document.querySelectorAll(
        ".tool[data-tool]"
    ).forEach(
        function(button){

            button.classList.toggle(
                "active",
                button.dataset.tool === tool
            );
        }
    );

    document.getElementById(
        "modeLabel"
    ).textContent =
        tool === "select"
        ? "SELECT MODE"
        : tool.toUpperCase() + " MODE";

    document.getElementById(
        "bottomMode"
    ).textContent =
        tool === "select"
        ? "SELECT"
        : tool.toUpperCase();

    if(
        selected &&
        tool !== "select"
    ){

        transform.setMode(tool);

        transform.attach(
            selected
        );

    }else{

        transform.detach();
    }
}

function deleteSelected(){

    if(!selected){

        showToast(
            "No object selected"
        );

        return;
    }

    const index =
        objects.indexOf(selected);

    scene.remove(selected);

    selected.geometry.dispose();

    selected.material.dispose();

    if(index !== -1){

        objects.splice(
            index,
            1
        );
    }

    selected = null;

    transform.detach();

    updateHierarchy();

    updateProperties();

    updateObjectCount();

    document.getElementById(
        "selectionInfo"
    ).textContent =
        "NO OBJECT SELECTED";

    showToast(
        "Object deleted"
    );
}

function saveScene(){

    const data =
        objects.map(
            function(object){

                return {
                    name:object.name,
                    geometry:
                        object.geometry.type,

                    position:{
                        x:object.position.x,
                        y:object.position.y,
                        z:object.position.z
                    },

                    rotation:{
                        x:object.rotation.x,
                        y:object.rotation.y,
                        z:object.rotation.z
                    },

                    scale:{
                        x:object.scale.x,
                        y:object.scale.y,
                        z:object.scale.z
                    }
                };
            }
        );

    localStorage.setItem(
        "ai3dstudio_scene",
        JSON.stringify(data)
    );

    showToast(
        "Scene saved"
    );
}

function loadScene(){

    const saved =
        localStorage.getItem(
            "ai3dstudio_scene"
        );

    if(!saved){

        showToast(
            "No saved scene"
        );

        return;
    }

    objects.slice().forEach(
        function(object){

            scene.remove(object);

            object.geometry.dispose();

            object.material.dispose();
        }
    );

    objects.length = 0;

    selected = null;

    transform.detach();

    const data =
        JSON.parse(saved);

    data.forEach(
        function(item){

            let geometry;

            if(
                item.geometry ===
                "SphereGeometry"
            ){

                geometry =
                    new THREE.SphereGeometry(
                        1.2,
                        32,
                        20
                    );

            }else if(
                item.geometry ===
                "CylinderGeometry"
            ){

                geometry =
                    new THREE.CylinderGeometry(
                        1.1,
                        1.1,
                        2.2,
                        32
                    );

            }else{

                geometry =
                    new THREE.BoxGeometry(
                        2,
                        2,
                        2
                    );
            }

            const object =
                new THREE.Mesh(
                    geometry,
                    createMaterial()
                );

            object.name =
                item.name;

            object.position.set(
                item.position.x,
                item.position.y,
                item.position.z
            );

            object.rotation.set(
                item.rotation.x,
                item.rotation.y,
                item.rotation.z
            );

            object.scale.set(
                item.scale.x,
                item.scale.y,
                item.scale.z
            );

            scene.add(object);

            objects.push(object);
        }
    );

    objectNumber =
        objects.length;

    updateHierarchy();

    updateProperties();

    updateObjectCount();

    showToast(
        "Scene loaded"
    );
}

function processAICommand(command){

    const text =
        command
        .toLowerCase()
        .trim();

    if(!text){
        return;
    }

    if(
        text.includes("create cube") ||
        text === "cube" ||
        text.includes("add cube")
    ){

        createObject("cube");

        return;
    }

    if(
        text.includes("create sphere") ||
        text === "sphere" ||
        text.includes("add sphere")
    ){

        createObject("sphere");

        return;
    }

    if(
        text.includes("create cylinder") ||
        text === "cylinder" ||
        text.includes("add cylinder")
    ){

        createObject("cylinder");

        return;
    }

    if(text.includes("delete")){

        deleteSelected();

        return;
    }

    if(text.includes("save")){

        saveScene();

        return;
    }

    if(text.includes("load")){

        loadScene();

        return;
    }

    if(text.includes("move")){

        setTool("translate");

        return;
    }

    if(text.includes("rotate")){

        setTool("rotate");

        return;
    }

    if(text.includes("scale")){

        setTool("scale");

        return;
    }

    if(text.includes("select")){

        setTool("select");

        return;
    }

    showToast(
        "AI command not recognized"
    );
}

let downX = 0;
let downY = 0;

canvas.addEventListener(
    "pointerdown",
    function(event){

        downX =
            event.clientX;

        downY =
            event.clientY;
    }
);

canvas.addEventListener(
    "pointerup",
    function(event){

        if(currentTool !== "select"){
            return;
        }

        const dx =
            event.clientX - downX;

        const dy =
            event.clientY - downY;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        if(distance > 5){
            return;
        }

        const rect =
            canvas.getBoundingClientRect();

        mouse.x =
            ((event.clientX -
                rect.left) /
                rect.width) *
                2 - 1;

        mouse.y =
            -((event.clientY -
                rect.top) /
                rect.height) *
                2 + 1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const hits =
            raycaster.intersectObjects(
                objects,
                false
            );

        if(hits.length){

            selectObject(
                hits[0].object
            );

        }else{

            deselect();
        }
    }
);

    "aiCommand"
).addEventListener(
    "keydown",

        if(event.key === "Enter"){

            processAICommand(
                this.value
            );

            this.value = "";
        }
    }
);

[
    "objectName",
    "posX",
    "posY",
    "posZ",
    "rotX",
    "rotY",
    "rotZ",
    "scaleX",
    "scaleY",
    "scaleZ"
].forEach(
    function(id){

        document.getElementById(id)
            .addEventListener(
                "change",
                function(){

                    if(!selected){
                        return;
                    }

                    const value =
                        function(id,fallback){

                            const number =
                                parseFloat(
                                    document
                                    .getElementById(id)
                                    .value
                                );

                            return Number.isFinite(number)
                                ? number
                                : fallback;
                        };

                    selected.name =
                        document
                        .getElementById(
                            "objectName"
                        )
                        .value ||
                        selected.name;

                    selected.position.set(
                        value(
                            "posX",
                            selected.position.x
                        ),
                        value(
                            "posY",
                            selected.position.y
                        ),
                        value(
                            "posZ",
                            selected.position.z
                        )
                    );

                    selected.rotation.set(
                        THREE.MathUtils.degToRad(
                            value(
                                "rotX",
                                THREE.MathUtils.radToDeg(
                                    selected.rotation.x
                                )
                            )
                        ),
                        THREE.MathUtils.degToRad(
                            value(
                                "rotY",
                                THREE.MathUtils.radToDeg(
                                    selected.rotation.y
                                )
                            )
                        ),
                        THREE.MathUtils.degToRad(
                            value(
                                "rotZ",
                                THREE.MathUtils.radToDeg(
                                    selected.rotation.z
                                )
                            )
                        )
                    );

                    selected.scale.set(
                        Math.max(
                            .01,
                            value(
                                "scaleX",
                                selected.scale.x
                            )
                        ),
                        Math.max(
                            .01,
                            value(
                                "scaleY",
                                selected.scale.y
                            )
                        ),
                        Math.max(
                            .01,
                            value(
                                "scaleZ",
                                selected.scale.z
                            )
                        )
                    );

                    updateHierarchy();
                    updateProperties();
                }
            );
    }
);

function resize(){

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;

    if(
        width <= 0 ||
        height <= 0
    ){
        return;
    }

    camera.aspect =
        width / height;

    camera.updateProjectionMatrix();

    renderer.setSize(
        width,
        height,
        false
    );
}

window.addEventListener(
    "resize",
    resize
);

function animate(){

    requestAnimationFrame(
        animate
    );

    orbit.update();

    renderer.render(
        scene,
        camera
    );
}

resize();

createObject("cube");

setTool("select");

animate();

</script>
